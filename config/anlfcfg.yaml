info:
  version: 1.0.0
  description: ANLF initial configuration

configuration:
  nfName: ANLF
  sbi:
    scheme: http
    bindingIPv4: 127.0.0.165
    registerIPv4: 127.0.0.165
    port: 8000
  serviceNameList:
    - nnwdaf-analyticsinfo
    - nnwdaf-eventssubscription
  nrfUri: http://127.0.0.10:8000
  
  recording:
    enable: true
    outputDir: ./output
  
  ebpf:
    enable: true
    interface: upfgtp
  
  monitoring:
    enable: true
    pollInterval: 3
    ueTablePath: /home/vagrant/AnLF/anlf/config/static_ue_list_20.json
  
  smf:
    url: http://127.0.0.2:8000  # SMF OAM API base URL
    pollInterval: 5  # Fetch UE data from SMF every 5 seconds
  
  anomalyDetection:
    enable: true  # Set to true to enable LLM-based anomaly detection
    serverUrl: http://140.113.208.89:8000  # LLM server endpoint
    timeout: 10  # Request timeout in seconds (10s to handle LLM warm-up and high concurrency)
    maxConcurrent: 100  # Max concurrent HTTP requests to LLM server (must match MaxIdleConnsPerHost)
    systemPromptPath: /home/vagrant/AnLF/anlf/prompts/anomaly_detection_low_latency.txt  # Path to system prompt file
    batchSize: 20  # Optimal batch size for LLM (5-10 UEs recommended for Qwen 2.5 1.5B)
    temperature: 0.0  # LLM temperature (0.0-2.0, lower = more deterministic)
    maxTokens: 50  # Max response tokens (sufficient for "Risk Score: X.X")
    includeGlobalContext: true  # Include global network statistics in prompt (avg PPS, Flow, Packet Size)
    
    # Risk Scoring Configuration (CUSUM-based cumulative risk assessment)
    riskScoring:
      enable: true                    # Enable risk scoring to convert LLM scores to actionable decisions
      llmConfidenceCutoff: 0.7       # LLM threshold: score >= 0.7 counts as "attack" (+50 to risk_score)
      hitsToBan: 2                    # Block after 2 attacks (100/2 = 50 points per attack)
      secondsToForgive: 20            # Decay to 0 in 20 seconds of good behavior (100/20 = 5 points/sec decay)
      blockThreshold: 80.0            # Block UE when risk_score >= 80
      unblockThreshold: 50.0          # Unblock UE when risk_score < 50 (prevents flapping)

logger:
  enable: true
  level: info
  reportCaller: false

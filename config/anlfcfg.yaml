info:
  version: 1.0.0
  description: ANLF initial configuration

configuration:
  nfName: ANLF
  sbi:
    scheme: http
    bindingIPv4: 127.0.0.165
    registerIPv4: 127.0.0.165
    port: 8000
  serviceNameList:
    - nnwdaf-analyticsinfo
    - nnwdaf-eventssubscription
  nrfUri: http://127.0.0.10:8000
  
  recording:
    enable: true
    outputDir: ./output
  
  ebpf:
    enable: true
    interface: upfgtp
  
  monitoring:
    enable: true
    pollInterval: 1
    ueTablePath: /home/vagrant/AnLF/anlf/config/static_ue_list.json

logger:
  enable: true
  level: info
  reportCaller: false

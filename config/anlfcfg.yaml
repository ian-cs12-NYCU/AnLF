info:
  version: 1.0.0
  description: ANLF initial configuration

configuration:
  nfName: ANLF
  sbi:
    scheme: http
    bindingIPv4: 127.0.0.165
    registerIPv4: 127.0.0.165
    port: 8000
  serviceNameList:
    - nnwdaf-analyticsinfo
    - nnwdaf-eventssubscription
  nrfUri: http://127.0.0.10:8000
  
  recording:
    enable: false
    output: ./output/data.csv
  
  ebpf:
    enable: true
    interface: upfgtp

logger:
  enable: true
  level: info
  reportCaller: false

info:
  version: 1.0.0
  description: ANLF initial configuration

configuration:
  nfName: ANLF
  sbi:
    scheme: http
    bindingIPv4: 127.0.0.165
    registerIPv4: 127.0.0.165
    port: 8000
  serviceNameList:
    - nnwdaf-analyticsinfo
    - nnwdaf-eventssubscription
  nrfUri: http://127.0.0.10:8000
  
  recording:
    enable: true
    outputDir: ./output
  
  ebpf:
    enable: true
    interface: upfgtp
  
  monitoring:
    enable: true
    pollInterval: 1
    ueTablePath: /home/vagrant/AnLF/anlf/config/static_ue_list_20.json
  
  anomalyDetection:
    enable: true  # Set to true to enable LLM-based anomaly detection
    serverUrl: http://140.113.208.76:8000  # LLM server endpoint
    timeout: 5  # Request timeout in seconds
    systemPromptPath: anlf/prompts/anomaly_detection_basic_singleUE.txt  # Path to system prompt file
    batchSize: 10  # Optimal batch size for LLM (5-10 UEs recommended for Qwen 2.5 1.5B)

logger:
  enable: true
  level: info
  reportCaller: false
